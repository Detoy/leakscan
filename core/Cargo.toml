[package]
name = "leakscan-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "On-device detection and scrubbing of aircraft Doppler tones and mains hum in audio (defensive privacy tool)."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = true
